<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>coffee card</title>
</head>
<body>
    <main>
        <div class="card">
        <div class="cardin">
        <div class="centent global"></div>
        <div class="buttons globalbtn"><button class="plus0">+</button><span class="count0">0</span><button class="min0">-</button></div>
        <div class="centent global"></div>
        <div class="buttons globalbtn"><button class="plus1">+</button><span class="count1">0</span><button class="min1">-</button></div>
        <div class="centent global"></div>
        <div class="buttons globalbtn"><button class="plus2">+</button><span class="count2">0</span><button class="min2">-</button></div>
        </div>
        <div class="incardadd">
         <div class="total"><h3 id="total">total: <span id="total"></span></h3></div>
        <div class="add"><h3 id="add">add</h3></div>
        <div class="buy"><h3 id="buy">buy</h3></div>
        </div>
       </div>
       <div class="modul">
            <div>
           <span class="close">close</span>
           </div>
           <div>
            <label for="">
           <input type="search" name="" id="search" placeholder="search..." search-input>
           </label>
          </div>
          <div class="yscrol">
             
          </div>
       </div>
       <div class="debtcard">
        <form action="" name="cardform">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="size-6" style=" width: 20px;height: 20px;" class="x">
  <path strokeLinecap="round" strokeLinejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
</svg>

            <div class="numbercard">
            <label for="numbercard">card number:</label><br>
            <input type="text" id="numbercard" placeholder="1234 1234 1234 1234" maxlength="20" name="number">
            <br><span id="valid1"></span>
            </div>
            <div class="Expiration-date">
            <label for="Expiration-date">Expiration date:</label><br>
            <input type="text" id="Expiration-date" placeholder="MM/YY" maxlength="5" name="date">
             <br><span id="valid2"></span>
            </div>
            <div class="Security-code">
            <label for="Security-code">Security code:</label><br>
            <input type="text" id="Security-code" placeholder="CVC" maxlength="4" name="pin">
             <br><span id="valid3"></span>
            </div>
            <div class="submit">
                <input type="submit" value="submit">
            </div>
        </form>
       </div>
    </main>
</body>
<script src="popover.js"></script>
<script src="min_and_plus.js"></script>
<script src="print.js"></script>
<script src="total.js"></script>
<script src="test.js"></script>
</html>
